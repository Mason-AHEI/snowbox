
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存储设置 - Snow Box</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #f3f4f6;
            color: #374151;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #e5e7eb;
            transform: translateX(-3px);
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .storage-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .storage-option {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .storage-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .storage-option.active {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .storage-option i {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .storage-option span {
            display: block;
            font-weight: 600;
            color: #374151;
        }
        .config-form {
            background: #f9fafb;
            padding: 25px;
            border-radius: 15px;
            display: none;
        }
        .config-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .info-text {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        .btn {
            flex: 1;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .feature {
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
            text-align: center;
        }
        .feature i {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .feature h4 {
            font-size: 14px;
            color: #374151;
            margin-bottom: 5px;
        }
        .feature p {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud"></i> 存储设置</h1>
            <p>配置您的游戏数据存储方式</p>
        </div>
        <div class="content">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> 返回仪表盘
            </button>
            
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-database"></i>
                    选择存储方式
                </div>
                <div class="storage-selector">
                    <div class="storage-option active" data-type="local" onclick="selectStorage('local')">
                        <i class="fas fa-hdd"></i>
                        <span>本地存储</span>
                    </div>
                    <div class="storage-option" data-type="r2" onclick="selectStorage('r2')">
                        <i class="fas fa-cloud"></i>
                        <span>Cloudflare R2</span>
                    </div>
                    <div class="storage-option" data-type="oss" onclick="selectStorage('oss')">
                        <i class="fas fa-server"></i>
                        <span>阿里云 OSS</span>
                    </div>
                </div>
            </div>

            <div class="config-form active" id="config-local">
                <div class="info-text">
                    <i class="fas fa-info-circle"></i> 
                    使用本地文件系统存储游戏数据，适合本地开发和小范围使用。
                </div>
                <div class="features">
                    <div class="feature">
                        <i class="fas fa-bolt"></i>
                        <h4>快速</h4>
                        <p>无需网络传输</p>
                    </div>
                    <div class="feature">
                        <i class="fas fa-lock"></i>
                        <h4>安全</h4>
                        <p>数据完全控制</p>
                    </div>
                    <div class="feature">
                        <i class="fas fa-coins"></i>
                        <h4>免费</h4>
                        <p>无额外费用</p>
                    </div>
                </div>
            </div>

            <div class="config-form" id="config-r2">
                <div class="info-text">
                    <i class="fas fa-info-circle"></i> 
                    Cloudflare R2 提供免费存储额度，适合中小型项目使用。需要先安装依赖: <code>pip install boto3</code>
                </div>
                <div class="form-group">
                    <label>Account ID</label>
                    <input type="text" id="r2-account-id" placeholder="输入您的 Cloudflare Account ID">
                </div>
                <div class="form-group">
                    <label>Access Key</label>
                    <input type="text" id="r2-access-key" placeholder="输入 Access Key">
                </div>
                <div class="form-group">
                    <label>Secret Key</label>
                    <input type="password" id="r2-secret-key" placeholder="输入 Secret Key">
                </div>
                <div class="form-group">
                    <label>Bucket 名称</label>
                    <input type="text" id="r2-bucket" placeholder="输入 Bucket 名称">
                </div>
            </div>

            <div class="config-form" id="config-oss">
                <div class="info-text">
                    <i class="fas fa-info-circle"></i> 
                    阿里云 OSS 提供免费试用额度，适合国内用户。需要先安装依赖: <code>pip install oss2</code>
                </div>
                <div class="form-group">
                    <label>Access Key ID</label>
                    <input type="text" id="oss-access-key-id" placeholder="输入 Access Key ID">
                </div>
                <div class="form-group">
                    <label>Access Key Secret</label>
                    <input type="password" id="oss-access-key-secret" placeholder="输入 Access Key Secret">
                </div>
                <div class="form-group">
                    <label>Endpoint</label>
                    <input type="text" id="oss-endpoint" placeholder="例如: oss-cn-hangzhou.aliyuncs.com">
                </div>
                <div class="form-group">
                    <label>Bucket 名称</label>
                    <input type="text" id="oss-bucket" placeholder="输入 Bucket 名称">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="testStorage()">
                    <i class="fas fa-check-circle"></i> 测试连接
                </button>
                <button class="btn btn-primary" onclick="saveConfig()">
                    <i class="fas fa-save"></i> 保存配置
                </button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let currentStorage = 'local';

        async function init() {
            // 权限检查：只有superadmin才能访问此页面
            var currentUser = getCurrentUser();
            if (!currentUser || currentUser.role !== 'superadmin') {
                alert('只有主管理员才能访问此功能');
                window.location.href = 'dashboard.html';
                return;
            }

            try {
                const response = await fetch(getApiBase() + '/api/storage/config');
                const data = await response.json();
                if (data.success) {
                    currentStorage = data.config.storage_type || 'local';
                    selectStorage(currentStorage);
                }
            } catch (error) {
                console.error('Failed to load config:', error);
            }
        }

        function selectStorage(type) {
            currentStorage = type;
            document.querySelectorAll('.storage-option').forEach(el => {
                el.classList.toggle('active', el.dataset.type === type);
            });
            document.querySelectorAll('.config-form').forEach(el => {
                el.classList.toggle('active', el.id === `config-${type}`);
            });
        }

        function getConfig() {
            if (currentStorage === 'local') {
                return {};
            } else if (currentStorage === 'r2') {
                return {
                    account_id: document.getElementById('r2-account-id').value,
                    access_key: document.getElementById('r2-access-key').value,
                    secret_key: document.getElementById('r2-secret-key').value,
                    bucket_name: document.getElementById('r2-bucket').value
                };
            } else if (currentStorage === 'oss') {
                return {
                    access_key_id: document.getElementById('oss-access-key-id').value,
                    access_key_secret: document.getElementById('oss-access-key-secret').value,
                    endpoint: document.getElementById('oss-endpoint').value,
                    bucket_name: document.getElementById('oss-bucket').value
                };
            }
            return {};
        }

        async function saveConfig() {
            try {
                const response = await fetch(getApiBase() + '/api/storage/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        storage_type: currentStorage,
                        config: getConfig()
                    })
                });
                const data = await response.json();
                
                showStatus(data.success, data.message);
            } catch (error) {
                showStatus(false, '保存失败: ' + error.message);
            }
        }

        async function testStorage() {
            try {
                if (currentStorage !== 'local') {
                    await saveConfig();
                }
                
                const response = await fetch(getApiBase() + '/api/storage/test', { method: 'POST' });
                const data = await response.json();
                
                showStatus(data.success, data.message);
            } catch (error) {
                showStatus(false, '测试失败: ' + error.message);
            }
        }

        function showStatus(success, message) {
            const status = document.getElementById('status');
            status.className = 'status ' + (success ? 'success' : 'error');
            status.innerHTML = `<i class="fas fa-${success ? 'check' : 'exclamation'}-circle"></i> ${message}`;
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }

        init();
    </script>
</body>
</html>
